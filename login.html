
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyRentals - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7fbfd;
            color: #1d2b36;
        }

        header {
            background-color: #023e8a;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
        }

        nav a:hover {
            color: #ff6f59;
        }

        .login-container {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #023e8a;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c7d1;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .login-btn {
            background-color: #ff6f59;
            color: white;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .login-btn:hover {
            background-color: #e55a45;
        }

        footer {
            background-color: #023e8a;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>

    <script>
        function validation() {

            let userName = document.getElementById("name").value;
            let userEmail = document.getElementById("email").value;
            let userContact = document.getElementById("phone").value;
            let userPassword = document.getElementById("pwd").value;
            let userRole = document.getElementById("role").value;

            if (userName == "") {
                alert("Please enter the User Name!");
                return false;
            }

            if (userEmail == "") {
                alert("Please enter an Email!");
                return false;
            }

            if (userContact == "") {
                alert("Please enter the Contact Number!");
                return false;
            }

            if (userPassword == "") {
                alert("Please enter the Password!");
                return false;
            }

            if (isNaN(userContact) || userContact.length != 10) {
                alert("Invalid Contact Number!");
                return false;
            }

            if (userRole == "") {
                alert("Please select your role!");
                return false;
            }

            // Demo navigation only, not authentication
            window.location.href = "dashboard.html";
            return false;
        }
    </script>
</head>

<body>

    <header>
        <div class="logo">EasyRentals</div>

        <nav>
            <a href="dashboard.html">Home</a>
            <a href="bookings.html">Booking</a>
        </nav>
    </header>

    <div class="login-container">

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to continue with EasyRentals
        </p>

        <form onsubmit="return validation()">

            <label>Full Name</label>
            <input type="text" id="name"
                   placeholder="Enter your full name">

            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email">

            <label>Contact Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your contact number">

            <label>Password</label>
            <input type="password" id="pwd"
                   placeholder="Enter your password">

            <label>Select Role</label>
            <select id="role">
                <option value="">Select your role</option>
                <option value="Customer">Customer</option>
                <option value="Admin">Admin</option>
            </select>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

    <footer>
        &copy; 2026 EasyRentals. All Rights Reserved.
    </footer>

</body>
</html>
